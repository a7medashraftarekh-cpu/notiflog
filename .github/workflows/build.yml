name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NotifLog.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd NotifLog && gradle assembleDebug
      - run: gh release create v${{ github.run_number }} NotifLog/app/build/outputs/apk/debug/app-debug.apk --title "APK ${{ github.run_number }}" --notes "NotifLog"
        env:
          GH_TOKEN: ${{ github.token }}
